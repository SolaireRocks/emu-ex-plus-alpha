name: Snes9x EX+ (custom)

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      all_abis:
        description: 'Build all ABIs (armv7, arm64, x86, x86_64) instead of only arm64'
        type: boolean
        default: false

env:
  NDK_VERSION: r30-beta1

jobs:
  build:
    name: Build Snes9x EX+
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout emu-ex-plus-alpha repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Select ABIs
      run: |
        if [ "${{ github.event.inputs.all_abis }}" = "true" ]
        then
          echo "ANDROID_ARCHS=armv7 arm64 x86 x86_64" >> $GITHUB_ENV
          echo "ABI_KEY=all" >> $GITHUB_ENV
        else
          echo "ANDROID_ARCHS=arm64" >> $GITHUB_ENV
          echo "ABI_KEY=arm64" >> $GITHUB_ENV
        fi
    - name: Decode debug keystore
      env:
        DEBUG_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE }}
      run: |
        if [ -z "$DEBUG_KEYSTORE" ]
        then
          echo '::warning::No DEBUG_KEYSTORE secret set, APK will be signed with a random key and will not install over previous builds'
        else
          echo "$DEBUG_KEYSTORE" | base64 --decode > .debug.keystore
          mkdir -p ~/.android
          mv .debug.keystore ~/.android/debug.keystore
        fi
    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends autoconf automake autopoint bash gcc-arm-linux-gnueabi file gawk gettext git libtool libtool-bin make nasm pkg-config unzip wget
    - name: Install CMake 4.3 (matches the import std UUID in imagine/cmake/config.cmake)
      uses: lukka/get-cmake@latest
      with:
        cmakeVersion: "~4.3.0"
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
    - name: Set up environment
      run: |
        mkdir -p imagine-sdk
        wget -q "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
        unzip -q android-ndk-${NDK_VERSION}-linux.zip
        rm android-ndk-${NDK_VERSION}-linux.zip
        mv android-ndk-${NDK_VERSION} android-ndk
        echo "ANDROID_NDK_PATH=${{ github.workspace }}/android-ndk" >> $GITHUB_ENV
        echo "EMUFRAMEWORK_PATH=${{ github.workspace }}/EmuFramework" >> $GITHUB_ENV
        echo "IMAGINE_PATH=${{ github.workspace }}/imagine" >> $GITHUB_ENV
        echo "IMAGINE_SDK_PATH=${{ github.workspace }}/imagine-sdk" >> $GITHUB_ENV
        echo "COMMIT_PREFIX=$(echo ${{ github.sha }} | cut -c1-8)" >> $GITHUB_ENV
    - name: Restore third-party library bundle
      id: bundle-cache
      uses: actions/cache/restore@v4
      with:
        path: imagine-sdk
        key: bundle-${{ env.ABI_KEY }}-${{ env.NDK_VERSION }}-${{ hashFiles('imagine/bundle/**', 'imagine/make/**', 'imagine/cmake/**') }}
    - name: Build third-party library bundle
      if: steps.bundle-cache.outputs.cache-hit != 'true'
      working-directory: imagine/bundle/all
      shell: bash
      run: |
        for arch in $ANDROID_ARCHS
        do
          ./makeAll-android-${arch}.sh install
        done
    - name: Save third-party library bundle
      if: steps.bundle-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: imagine-sdk
        key: ${{ steps.bundle-cache.outputs.cache-primary-key }}
    - name: Build imagine and EmuFramework
      shell: bash
      run: |
        set -o pipefail
        mkdir -p build-logs
        { $IMAGINE_PATH/android.sh config --presets "$ANDROID_ARCHS" &&
          $IMAGINE_PATH/android.sh installLinks --config Release --presets "$ANDROID_ARCHS" &&
          $EMUFRAMEWORK_PATH/android.sh config --presets "$ANDROID_ARCHS" &&
          $EMUFRAMEWORK_PATH/android.sh installLinks --config Release --presets "$ANDROID_ARCHS" -- -k 0; } 2>&1 | tee build-logs/framework.log
    - name: Build Snes9x EX+
      working-directory: Snes9x
      shell: bash
      run: |
        set -o pipefail
        mkdir -p ../EX-Emulators
        make -f android.mk android-apk CONFIG=Release "android_arch=$ANDROID_ARCHS" -j`nproc` 2>&1 | tee ../build-logs/snes9x.log
        cp build/android/build/outputs/apk/release/Snes9xEXPlus-release.apk "../EX-Emulators/Snes9xEXPlus-${COMMIT_PREFIX}.apk"
    - name: Report build errors as annotations
      if: failure()
      shell: bash
      run: |
        # Job logs require sign-in to read but annotations don't, so surface the important lines there
        for log in build-logs/*.log
        do
          [ -f "$log" ] || continue
          grep -n -A6 -E "error:|Error:|Error [0-9]|FAILED|fatal|CMake Error|No such file|undefined reference|\*\*\*" "$log" | head -n 200 > errs.txt || true
          if [ ! -s errs.txt ]
          then
            tail -n 60 "$log" > errs.txt
          fi
          split -l 20 errs.txt errpart-
          n=0
          for part in errpart-*
          do
            n=$((n+1))
            [ $n -gt 9 ] && break
            msg=$(sed -e 's/%/%25/g' "$part" | awk '{printf "%s%%0A", $0}')
            echo "::error title=$(basename $log) part $n::$msg"
          done
          rm -f errpart-* errs.txt
        done
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: Snes9xEXPlus-${{ env.COMMIT_PREFIX }}
        path: EX-Emulators/
    - name: Publish APK to the "snes9x-custom-latest" pre-release
      if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/custom-features')
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        cp "EX-Emulators/Snes9xEXPlus-${COMMIT_PREFIX}.apk" Snes9xEXPlus-custom.apk
        TAG="snes9x-custom-latest"
        git tag -f "$TAG"
        git push -f origin "$TAG"
        if gh release view "$TAG" > /dev/null 2>&1
        then
          gh release upload "$TAG" Snes9xEXPlus-custom.apk --clobber
          gh release edit "$TAG" --notes "Built from ${GITHUB_REF_NAME} @ ${COMMIT_PREFIX}"
        else
          gh release create "$TAG" Snes9xEXPlus-custom.apk --prerelease --title "Snes9x EX+ custom build" --notes "Built from ${GITHUB_REF_NAME} @ ${COMMIT_PREFIX}"
        fi
